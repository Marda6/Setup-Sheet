      <div class="hmenu" id="userMenu" hidden>
        <button data-uact="settings"><svg><use href="#i-user"/></svg>Account settings</button>
        <div class="hmenu__sep"></div>
        <button class="is-danger" data-uact="logout"><svg><use href="#i-logout"/></svg>Log out</button>
      </div>
    </aside>

    <!-- ===================== INBOX (opens from the bell) ===================== -->
    <aside class="panel inbox" id="inbox" hidden>
      <header class="panel__head inbox__head">
        <div class="inbox__title">Inbox</div>
        <div class="panel__hspacer"></div>
        <button class="header__iconbtn" id="inboxClose" title="Close"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="inbox__tabs">
        <div class="seg">
          <button data-itab="ntf" class="is-active">Notifications<i class="seg__cnt" id="cntNtf"></i></button>
          <button data-itab="inv">Invites<i class="seg__cnt" id="cntInv"></i></button>
        </div>
      </div>
      <div class="panel__body inbox__body" id="inboxBody"></div>
    </aside>

    <!-- ===================== CONTENT ===================== -->
    <section class="panel clouds">
      <header class="panel__head clouds__head">
        <button class="header__iconbtn clouds__back" id="colBack" hidden title="Back to collections"><svg><use href="#i-back"/></svg></button>
        <div class="clouds__title" id="cloudsTitle">All projects</div>
        <span class="coltag" id="colTag" hidden>Collection</span>
        <span class="clouds__sub" id="cloudsSub" hidden></span>
        <button class="header__iconbtn clouds__info" id="colInfoBtn" hidden title="Collection info"><svg><use href="#i-info"/></svg></button>
        <div class="panel__hspacer"></div>
        <div class="search">
          <svg><use href="#i-search"/></svg>
          <input class="field" id="searchField" type="text" placeholder="Search a project" />
        </div>
        <span class="panel__sep"></span>
        <button class="header__iconbtn" id="chat3dBtn" hidden title="3D view"><svg><use href="#i-panel-right"/></svg></button>
        <div class="panel__mode" id="viewMode">
          <button data-mode="list" title="List view"><svg><use href="#i-rows"/></svg></button>
          <button data-mode="grid" class="is-active" title="Grid view"><svg><use href="#i-grid-view"/></svg></button>
        </div>
        <button class="panel__settings" id="sortBtn" title="Sort"><svg><use href="#i-sort"/></svg></button>
        <div class="hmenu" id="sortMenu" hidden></div>
      </header>
      <div class="filters" id="filters"></div>
      <div class="panel__body clouds__body" id="cloudsBody"></div>
      <div class="hmenu" id="filterMenu" hidden></div>
      <div class="hmenu" id="morefMenu" hidden></div>
      <div class="hmenu colinfo" id="colInfoMenu" hidden></div>
      <div class="hmenu" id="cardMenu" hidden></div>
      <div class="hmenu" id="langMenu" hidden></div>
      <div class="hmenu" id="tagMenu" hidden></div>
      <div class="hmenu" id="c3dMenu" hidden></div>
      <!-- media & files quick view -->
      <div class="modal" id="mediaModal" hidden>
        <div class="modal__card">
          <div class="modal__head">
            <b>Media &amp; files</b><span class="modal__cnt" id="mediaCnt"></span>
            <div class="panel__hspacer"></div>
            <button class="header__iconbtn" id="mediaClose" title="Close"><svg><use href="#i-close"/></svg></button>
          </div>
          <div class="inbox__filters" id="mediaTabs"></div>
          <div class="modal__body" id="mediaBody"></div>
        </div>
      </div>
    </section>

  </div>
</div>

<script src="clouds.js"></script>
</body>
</html>
