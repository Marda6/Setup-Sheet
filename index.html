<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sequential machining (WIP) · ENCY Core</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ===================== ICON SPRITE (ENCY PwIcons + operation-icons) ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-chevdown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-dotsv" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L4 21l1.9-4.7A8.5 8.5 0 1 1 21 11.5z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.9.4-1.5 1-1.5 2M12 17h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 3v18M4 7.5l8 4.5 8-4.5"/></symbol>
  <symbol id="i-sheet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M3.5 9h17M3.5 14.5h17M9 9v11M15 9v11"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5M3 16.5l9 5 9-5"/></symbol>
  <symbol id="i-grid-view" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14a0 0 0 0 1 0 0H6a0 0 0 0 1 0 0V3z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 6M21 19a5 5 0 0 0-3.5-4.8"/></symbol>
  <symbol id="i-toolbit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4v9l-2 3-2-3z"/><path d="M12 15v6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-wand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l9-9M14.5 5.5l1 1M17 3l.6 1.8L19.5 5.5l-1.6 1L17 8.5l-.9-2L14.5 5.5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l4 4 12-11"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></symbol>
  <symbol id="i-skip-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L9 12l9 6zM6 5v14"/></symbol>
  <symbol id="i-skip-fwd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l9 6-9 6zM18 5v14"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-axes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V5M5 19h14M5 9l-2 2M5 5l-2 2M19 19l2-2M15 19l2 2"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="10" rx="1.5"/><path d="M7 7v3M11 7v4M15 7v3M19 7v4"/></symbol>
  <symbol id="i-mesh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8c4 3 12 3 16 0M4 12c4 3 12 3 16 0M4 16c4 3 12 3 16 0"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>

  <symbol id="op-machine" viewBox="0 0 20 20">
    <path d="M14.584 4.583c.46 0 .833.374.833.834v5.766c0 .09-.015.178-.043.263-.253.76-1.327.76-1.58 0a.833.833 0 0 1-.044-.263V5.417c0-.46.374-.834.834-.834z" fill="var(--operation-icon-fill)" stroke="var(--operation-icon-accent)" stroke-width=".833" stroke-linejoin="round"/>
    <rect x="2.916" y="5.417" width="6.667" height="11.667" rx="1.25" fill="var(--operation-icon-fill)" stroke="var(--operation-icon-accent)" stroke-width=".833" stroke-linejoin="round"/>
    <rect x="2.916" y="13.749" width="14.167" height="4.167" rx="1.25" fill="var(--operation-icon-fill)" stroke="var(--operation-icon-accent)" stroke-width=".833" stroke-linejoin="round"/>
    <rect x="8.75" y="3.749" width="4.167" height="4.167" rx="1.25" fill="var(--operation-icon-fill)" stroke="var(--operation-icon-accent)" stroke-width=".833" stroke-linejoin="round"/>
    <rect x="12.083" y="2.083" width="5" height="6.667" rx="1.25" fill="var(--operation-icon-fill)" stroke="var(--operation-icon-accent)" stroke-width=".833" stroke-linejoin="round"/>
    <rect x="5.416" y="2.083" width="4.167" height="8.333" rx="1.25" fill="var(--operation-icon-fill)" stroke="var(--operation-icon-accent)" stroke-width=".833" stroke-linejoin="round"/>
  </symbol>
  <symbol id="op-setup" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="7.083" fill="#F6F6F6" stroke="#3B3E48" stroke-width=".833"/>
    <path d="M17.5 10c0-.985-.194-1.96-.571-2.87A7.5 7.5 0 0 0 10 2.5V10h7.5z" fill="#3B3E48"/>
    <path d="M2.5 10a7.5 7.5 0 0 0 7.5 7.5V10H2.5z" fill="#3B3E48"/>
  </symbol>
  <symbol id="op-part" viewBox="0 0 20 20">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M9.554 2.121a.9.9 0 0 1 .892 0l6.111 3.552c.274.16.443.453.443.77v7.116a.89.89 0 0 1-.443.769l-6.111 3.552a.9.9 0 0 1-.892 0l-6.111-3.552A.89.89 0 0 1 3 13.558V6.442c0-.317.169-.61.442-.769L9.554 2.121zM9.999 6.948a3.052 3.052 0 1 0 0 6.104 3.052 3.052 0 0 0 0-6.104z" fill="var(--operation-icon-fill)"/>
  </symbol>
  <symbol id="op-operation" viewBox="0 0 20 20">
    <rect x=".625" y=".625" width="18.75" height="18.75" rx="1.875" stroke="var(--operation-icon-fill)" stroke-width="1.25"/>
    <path d="M11.25 8.75h1.25V2.5h-1.25z" fill="var(--operation-icon-fill)"/>
    <path d="M12.5 8.75h1.25V2.5H12.5z" fill="var(--operation-icon-fill)"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M2.5 17.5h6.25V15A5 5 0 0 1 8.75 5V2.5H2.5z" fill="var(--operation-icon-fill)"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M7.5 10 10 10V7.5A2.5 2.5 0 0 0 7.5 10z" fill="var(--operation-icon-fill)"/>
    <path d="M7.5 10a2.5 2.5 0 0 0 2.5 2.5V10z" fill="var(--operation-icon-fill)"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 7.5h2.5V10H10z" fill="var(--operation-icon-fill)"/>
    <path d="M10 12.5h2.5V10H10z" fill="var(--operation-icon-fill)"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M15 7.5V10h-2.5V7.5z" fill="var(--operation-icon-fill)"/>
    <path d="M12.5 12.5H15V10h-2.5z" fill="var(--operation-icon-fill)"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M15 10V7.5A2.5 2.5 0 0 1 17.5 10z" fill="var(--operation-icon-fill)"/>
    <path d="M15 12.5A2.5 2.5 0 0 0 17.5 10H15z" fill="var(--operation-icon-fill)"/>
  </symbol>
</svg>

<div class="workspace" id="workspace">

  <!-- ===================== APP RAIL ===================== -->
  <nav class="railnav">
    <div class="railnav__logo">EC</div>
    <button class="railnav__btn is-active" title="Project"><svg><use href="#i-cube"/></svg></button>
    <button class="railnav__btn" title="Files"><svg><use href="#i-file"/></svg></button>
    <button class="railnav__btn" title="Layers"><svg><use href="#i-layers"/></svg></button>
    <button class="railnav__btn" title="Members"><svg><use href="#i-users"/></svg></button>
    <div class="railnav__spacer"></div>
    <button class="railnav__btn" title="Help"><svg><use href="#i-help"/></svg></button>
    <div class="railnav__avatar">RM</div>
  </nav>

  <!-- ===================== LEFT NAVIGATOR ===================== -->
  <aside class="leftpanel" id="leftpanel">
    <div class="leftpanel__head">
      <button class="mini-btn" title="Back"><svg><use href="#i-back"/></svg></button>
      <div class="leftpanel__title">
        <div class="leftpanel__name">Sequential machining (WIP)</div>
        <div class="leftpanel__meta">#2356 · Updated Jun 29, 2026</div>
      </div>
      <button class="mini-btn" title="More"><svg><use href="#i-dotsv"/></svg></button>
    </div>

    <div class="leftpanel__tabs" role="tablist">
      <button class="ltab" data-tab="overview">Overview</button>
      <button class="ltab is-active" data-tab="operations">Operations</button>
      <button class="ltab" data-tab="sheet">Setup sheet</button>
    </div>

    <div class="leftpanel__body">
      <div class="ltab-pane" id="lp-overview"></div>
      <div class="ltab-pane is-active" id="lp-operations"></div>
      <div class="ltab-pane" id="lp-sheet"><div id="setupSheet"></div></div>
    </div>
  </aside>

  <!-- ===================== CENTER DOCK ===================== -->
  <main class="center">
    <!-- floating actions -->
    <div class="center__actions">
      <button class="icon-btn" title="Chat"><svg><use href="#i-chat"/></svg><span class="icon-btn__badge">2</span></button>
      <button class="icon-btn" title="Download"><svg><use href="#i-download"/></svg></button>
      <button class="icon-btn" title="Help"><svg><use href="#i-help"/></svg></button>
      <button class="pill"><svg><use href="#i-users"/></svg><span>Share</span></button>
      <button class="pill pill--primary"><svg><use href="#i-cube"/></svg><span>Open in ENCY</span></button>
    </div>

    <div class="dock" id="dock">
      <!-- 3D pane -->
      <section class="pane pane--3d" id="pane3d">
        <header class="pane__head">
          <button class="pane__switch"><svg><use href="#i-cube"/></svg>3D Viewer<svg class="pane__caret"><use href="#i-chevdown"/></svg></button>
          <div class="pane__head-actions">
            <button class="mini-btn" title="Fit part"><svg><use href="#i-target"/></svg></button>
            <button class="mini-btn" id="collapse3d" title="Collapse"><svg><use href="#i-chevdown"/></svg></button>
          </div>
        </header>
        <div class="pane__body stage">
          <img class="stage__img" src="assets/view-3d.png" alt="3D scene"
               onerror="this.style.display='none';this.nextElementSibling.style.display='grid';" />
          <div class="stage__placeholder" style="display:none">3D scene<br><small style="opacity:.6">assets/view-3d.png</small></div>

          <div class="viewbar">
            <button class="viewbar__btn is-active" title="Orient"><svg><use href="#i-cube"/></svg></button>
            <button class="viewbar__btn" title="Part"><svg><use href="#i-box"/></svg></button>
            <button class="viewbar__btn" title="Toolpath"><svg style="color:var(--ec-green)"><use href="#i-mesh"/></svg></button>
            <button class="viewbar__btn" title="Tool"><svg style="color:var(--op-coral)"><use href="#i-toolbit"/></svg></button>
            <button class="viewbar__btn" title="Origin"><svg><use href="#i-target"/></svg></button>
            <button class="viewbar__btn" title="Axes"><svg><use href="#i-axes"/></svg></button>
            <div class="viewbar__sep"></div>
            <button class="viewbar__btn" title="Grid"><svg><use href="#i-grid"/></svg></button>
            <button class="viewbar__btn" title="Measure"><svg><use href="#i-ruler"/></svg></button>
          </div>

          <div class="details-card" id="detailsCard" hidden>
            <div class="details-card__accent"></div>
            <div class="details-card__head">
              <div><div class="details-card__eyebrow">Operation details</div><div class="details-card__title" id="dcTitle">—</div></div>
              <button class="btn-ghost" id="dcClose" title="Close"><svg><use href="#i-close"/></svg></button>
            </div>
            <div class="details-card__body" id="dcBody"></div>
          </div>

          <div class="timeline">
            <button class="timeline__btn" title="Previous"><svg><use href="#i-skip-back"/></svg></button>
            <button class="timeline__btn timeline__btn--play" id="playBtn" title="Play"><svg><use href="#i-play"/></svg></button>
            <button class="timeline__btn" title="Next"><svg><use href="#i-skip-fwd"/></svg></button>
            <span class="timeline__time">2:19</span>
            <div class="timeline__track"><div class="timeline__fill"></div><div class="timeline__knob"></div></div>
            <span class="timeline__time">5:29:38</span>
          </div>
        </div>
      </section>

      <div class="dock-divider" id="dockDivider" title="Drag to resize"></div>

      <!-- data table pane -->
      <section class="pane pane--table" id="paneTable">
        <header class="pane__head">
          <button class="pane__switch" id="tableSwitch"><svg><use href="#i-toolbit"/></svg><span id="tableSwitchLabel">Tool table</span><svg class="pane__caret"><use href="#i-chevdown"/></svg></button>
          <div class="pane__head-actions">
            <div class="searchbox"><svg><use href="#i-search"/></svg><input placeholder="Search" /></div>
            <button class="mini-btn" title="Expand"><svg><use href="#i-expand"/></svg></button>
            <button class="mini-btn" id="collapseTable" title="Collapse"><svg><use href="#i-chevdown"/></svg></button>
          </div>
          <div class="pane__menu" id="tableMenu" hidden>
            <button data-view="tools" class="is-active"><svg><use href="#i-toolbit"/></svg>Tool table</button>
            <button data-view="sheet"><svg><use href="#i-sheet"/></svg>Setup sheet</button>
            <button data-view="holes"><svg><use href="#i-target"/></svg>Holes</button>
          </div>
        </header>
        <div class="pane__body" id="tableBody"></div>
      </section>
    </div>
  </main>

  <div class="backdrop" id="backdrop"></div>
</div>

<script src="app.js"></script>
</body>
</html>
